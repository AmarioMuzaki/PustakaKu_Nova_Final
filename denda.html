<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Denda | PustakaKU Nova</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <b>📚 PustakaKU Nova</b>
        <nav></nav>
        <button onclick="out()">Keluar</button>
      </aside>
      <main class="main">
        <div class="top">
          <div>
            <small>Rp1.000 / hari</small>
            <h1>Denda</h1>
          </div>
          <div class="avatar">A</div>
        </div>
        <div class="cards">
          <div class="card">Total Denda<b id="total"></b></div>
          <div class="card">Belum Dibayar<b id="unpaid"></b></div>
        </div>
        <div class="table-wrap"><table class="table">
          <thead>
            <tr>
              <th>Anggota</th>
              <th>Buku</th>
              <th>Terlambat</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table></div>
      </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      function render() {
        list.innerHTML = fines
          .map(
            (f, i) =>
              `<tr><td>${f.member}</td><td>${f.book}</td><td>${f.days} hari</td><td>${rupiah(f.total)}</td><td>${f.status} ${f.status !== "Lunas" ? `<button class="action" onclick="pay(${i})">Bayar</button>` : ""}</td></tr>`,
          )
          .join("");
        total.textContent = rupiah(fines.reduce((a, f) => a + f.total, 0));
        unpaid.textContent = rupiah(
          fines
            .filter((f) => f.status !== "Lunas")
            .reduce((a, f) => a + f.total, 0),
        );
      }
      function pay(i) {
        fines[i].status = "Lunas";
        save();
        render();
      }
      render();
    </script>
  </body>
</html>
