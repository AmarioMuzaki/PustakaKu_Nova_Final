<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard | PustakaKU Nova</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <b>📚 PustakaKU Nova</b>
        <nav></nav>
        <button onclick="out()">Keluar</button>
      </aside>
      <main class="main">
        <div class="top">
          <div>
            <small>Selamat datang 👋</small>
            <h1>Dashboard</h1>
          </div>
          <div class="avatar">A</div>
        </div>
        <div class="cards">
          <div class="card">📚 Total Buku<b id="b"></b></div>
          <div class="card">👥 Anggota<b id="m"></b></div>
          <div class="card">📖 Transaksi<b id="l"></b></div>
          <div class="card">💰 Denda<b id="f"></b></div>
        </div>
        <div class="panel">
          <h2>Aktivitas Terbaru</h2>
          <div class="table-wrap"><table class="table">
            <thead>
              <tr>
                <th>Anggota</th>
                <th>Buku</th>
                <th>Status</th>
                <th>Jatuh Tempo</th>
              </tr>
            </thead>
            <tbody id="activity"></tbody>
          </table></div>
        </div>
      </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      b.textContent = books.length;
      m.textContent = members.length;
      l.textContent = loans.length;
      f.textContent = rupiah(
        fines
          .filter((x) => x.status !== "Lunas")
          .reduce((a, x) => a + x.total, 0),
      );
      activity.innerHTML = loans
        .slice(-6)
        .reverse()
        .map(
          (x) =>
            `<tr><td>${x.member}</td><td>${x.book}</td><td>${x.status}</td><td>${x.due}</td></tr>`,
        )
        .join("");
    </script>
  </body>
</html>
